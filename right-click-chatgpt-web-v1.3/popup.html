<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Right Click → ChatGPT</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      width: 320px;
      margin: 0;
      padding: 16px;
      line-height: 1.5;
    }
    h1 { font-size: 17px; margin: 0 0 12px; }
    p { font-size: 13px; margin: 8px 0; }
    .box {
      padding: 12px;
      border: 1px solid #8885;
      border-radius: 10px;
    }
    .ok { font-weight: 700; }
  </style>
</head>
<body>
  <h1>Right Click → ChatGPT</h1>
  <div class="box">
    <p class="ok">✅ Chỉ sử dụng ChatGPT Web</p>
    <p>Không dùng Gemini API và không gửi dữ liệu sang Telegram.</p>
  </div>
  <p><b>Cách dùng:</b> bôi đen văn bản trên trang web → chuột phải → chọn <b>Hỏi ChatGPT</b>.</p>
  <p>Extension sẽ mở hoặc chuyển sang tab ChatGPT, điền nội dung đã chọn và tự gửi.</p>
</body>
</html>
