<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trợ lý AI</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    body { width: 340px; margin: 0; padding: 16px; box-sizing: border-box; }
    h1 { font-size: 18px; margin: 0 0 4px; }
    .sub { color: GrayText; font-size: 12px; line-height: 1.45; margin: 0 0 12px; }
    .item { display: flex; gap: 9px; align-items: flex-start; padding: 11px; margin: 8px 0; border: 1px solid #8885; border-radius: 10px; background: transparent; color: inherit; width: 100%; text-align: left; cursor: pointer; font: inherit; box-sizing: border-box; }
    .item:hover { background: color-mix(in srgb, CanvasText 7%, Canvas); }
    .item.selected { border-color: #5286df; background: color-mix(in srgb, #5286df 12%, Canvas); }
    .item input { margin: 3px 0 0; flex: 0 0 auto; }
    .icon { font-size: 20px; width: 26px; flex: 0 0 26px; text-align: center; }
    .title { display: block; font-size: 13px; font-weight: 700; margin-bottom: 2px; }
    .desc { display: block; color: GrayText; font-size: 11px; line-height: 1.35; }
    .current { font-size: 12px; font-weight: 650; margin: 10px 0 4px; }
    .settings { display: block; width: 100%; padding: 9px 12px; margin-top: 10px; border: 1px solid #8887; border-radius: 8px; background: transparent; color: inherit; font: inherit; font-weight: 600; cursor: pointer; }
    .config { font-size: 11px; color: GrayText; line-height: 1.5; padding-top: 8px; }
    .status { min-height: 18px; padding: 7px 0 2px; font-size: 12px; overflow-wrap: anywhere; }
    .status.error { color: #dc2626; }
    .status.ok { color: #16a34a; }
    hr { border: 0; border-top: 1px solid #8884; margin: 12px 0 8px; }
  </style>
</head>
<body>
  <h1>Trợ lý AI</h1>
  <p class="sub">Chọn một chế độ mặc định bên dưới. Sau đó chỉ cần bôi đen văn bản và chuột phải; extension sẽ tự chạy chế độ đã chọn. Mở popup lại khi muốn đổi chế độ.</p>

  <label class="item" for="mode-chatgpt">
    <input type="radio" name="mode" id="mode-chatgpt" value="chatgpt">
    <span class="icon">💬</span>
    <span><span class="title">1. ChatGPT Web</span><span class="desc">Gửi câu hỏi đang bôi đen sang ChatGPT và tự gửi.</span></span>
  </label>

  <label class="item" for="mode-gemini">
    <input type="radio" name="mode" id="mode-gemini" value="gemini">
    <span class="icon">✨</span>
    <span><span class="title">2. Gemini → Telegram</span><span class="desc">Gemini trả lời câu hỏi đang bôi đen rồi chỉ gửi đáp án qua Telegram.</span></span>
  </label>

  <label class="item" for="mode-android">
    <input type="radio" name="mode" id="mode-android" value="android">
    <span class="icon">📱</span>
    <span><span class="title">3. Đọc màn hình Android</span><span class="desc">Chuột phải trên văn bản đã bôi đen để kích hoạt ADB/OCR; nội dung điện thoại được gửi sang ChatGPT.</span></span>
  </label>

  <div id="currentMode" class="current">Đang tải chế độ…</div>
  <div id="status" class="status" role="status" aria-live="polite">Đang tải lựa chọn đã lưu…</div>
  <hr>
  <button id="settings" class="settings" type="button">⚙ Cài đặt API key / Telegram / Model</button>
  <div id="config" class="config">Đang kiểm tra cấu hình…</div>
  <div id="lastRun" class="config">Đang kiểm tra kết quả Gemini gần nhất…</div>

  <script src="popup.js"></script>
</body>
</html>
